# =========================================================================
#  GENERATED FILE — DO NOT EDIT BY HAND.
#  Source:     gateway/routes.manifest.js  (routing)
#              gateway/nginx.conf.tmpl     (nginx tuning)
#  Regenerate: npm run gateway:build
#  Verify:     npm run gateway:check
#  Any manual edit here is overwritten on the next build.
# =========================================================================
worker_processes auto;
worker_rlimit_nofile 40960;

events {
    worker_connections 40960;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # gzip responses (API JSON benefits a lot)
    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_types         application/json application/javascript text/plain text/css application/xml;

    # Logging
    log_format main '$remote_addr - $request_time "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Edge rate limiting (defence in depth; services also rate-limit)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # ---- upstreams (generated from gateway/routes.manifest.js) ----
    upstream auth_service         { server auth-service:4001; }
    upstream academic_service     { server academic-service:4002; }
    upstream record_service       { server record-service:4003; }
    upstream payment_service      { server payment-service:4004; }
    upstream notification_service { server notification-service:4005; }

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 2m;

        # Redirects use the internal port 80, not the published host port.
        absolute_redirect off;

        # Gateway health
        location = /health {
            default_type application/json;
            return 200 '{"service":"gateway","status":"ok"}';
        }

        # Services mount their routes under /api/... themselves, so the
        # original URI is passed through unchanged (no path rewrite).
        # nginx matches the LONGEST prefix, so the /internal blocks below
        # always win over the public prefix they sit under.

        # ---- auth-service (auth-service:4001) ----
        # service-to-service only; never reachable from outside docker
        location /api/auth/internal {
            return 403 '{"error":"forbidden"}';
        }
        location /api/auth {
            proxy_pass http://auth_service;
        }

        # ---- academic-service (academic-service:4002) ----
        # service-to-service only; never reachable from outside docker
        location /api/academic/internal {
            return 403 '{"error":"forbidden"}';
        }
        location /api/students {
            proxy_pass http://academic_service;
        }
        location /api/teachers {
            proxy_pass http://academic_service;
        }
        location /api/classes {
            proxy_pass http://academic_service;
        }
        location /api/courses {
            proxy_pass http://academic_service;
        }
        location /api/enrollments {
            proxy_pass http://academic_service;
        }

        # ---- record-service (record-service:4003) ----
        location /api/grades {
            proxy_pass http://record_service;
        }
        location /api/attendance {
            client_max_body_size 5m;
            proxy_read_timeout 60s;
            proxy_pass http://record_service;
        }

        # ---- payment-service (payment-service:4004) ----
        # service-to-service only; never reachable from outside docker
        location /api/payments/internal {
            return 403 '{"error":"forbidden"}';
        }
        location /api/payments {
            proxy_read_timeout 45s;
            proxy_pass http://payment_service;
        }

        # ---- notification-service (notification-service:4005) ----
        # service-to-service only; never reachable from outside docker
        location /api/notifications/internal {
            return 403 '{"error":"forbidden"}';
        }
        location /api/notifications {
            proxy_pass http://notification_service;
        }

        # Everything else
        location / {
            default_type application/json;
            return 404 '{"error":"route not found"}';
        }
    }
}
