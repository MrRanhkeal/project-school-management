worker_processes auto;
worker_rlimit_nofile 40960;

events {
    worker_connections 40960;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # gzip responses (API JSON benefits a lot)
    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_proxied       any;
    gzip_types         application/json application/javascript text/plain text/css application/xml;

    # Logging
    log_format main '$remote_addr - $request_time "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Simple rate limit: 20 req/s per client IP, small burst
    # limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Edge rate limiting (defence in depth; services also rate-limit)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Ports must match *_SERVICE_PORT in .env
    upstream auth_service     { server auth-service:4001; }
    upstream academic_service { server academic-service:4002; }
    upstream record_service   { server record-service:4003; }
    upstream payment_service  { server payment-service:4004; }

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    server {
        listen 80 default_server;
        server_name _;

        # Larger payloads (bulk attendance) allowed
        client_max_body_size 2m;

        # internal port 80 instead of the published host port 8080).
        absolute_redirect off;

        # Gateway health
        location = /health {
            default_type application/json;
            return 200 '{"service":"gateway","status":"ok"}';
        }

        # Services mount their routes under /api/... themselves, so the
        # original URI is passed through unchanged (no path rewrite).

        # ---- auth-service ----
        # Internal service-to-service endpoints must never be reachable
        # from outside the docker network.
        location /api/auth/internal {
            return 403 '{"error":"forbidden"}';
        }
        location /api/auth {
            proxy_pass http://auth_service;
        }

        # ---- academic-service ----
        location /api/students { proxy_pass http://academic_service; }
        location /api/teachers { proxy_pass http://academic_service; }
        location /api/classes  { proxy_pass http://academic_service; }
        location /api/courses  { proxy_pass http://academic_service; }

        # ---- records-service ----
        location /api/grades     { proxy_pass http://record_service; }
        location /api/attendance { proxy_pass http://record_service; }

        # ---- payment-service ----
        location /api/payments   { proxy_pass http://payment_service; }

        # Everything else
        location / {
            default_type application/json;
            return 404 '{"error":"route not found"}';
        }
    }
}
